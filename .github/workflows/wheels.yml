name: Build

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            windows-latest,
            macos-latest,
            macos-15-intel,
          ]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test build support
        run: |
          python -m pip install setuptools
          python -m unittest discover -s tools/tests -v

      - name: Build sdist
        run: |
          pipx run build --sdist
          python3 -c "import os,pathlib,glob; pathlib.Path(os.environ['GITHUB_ENV']).write_text('SDIST_PATH=' + glob.glob('dist/*.tar.gz')[0] + '\n')"

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-* cp315-* cp315t-* pp311-* pp312-*"
          CIBW_TEST_COMMAND: >-
            python -m pymunk.tests &&
            python {project}/tools/tests/check_wheel_backend.py
        with:
          package-dir: ${{ env.SDIST_PATH }}

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        if: ${{ github.ref == 'refs/heads/master'}}
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          retention-days: 7

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        if: ${{ github.ref == 'refs/heads/master' && matrix.os ==
          'windows-latest'}}
        with:
          name: sdist-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./dist/*.tar.gz
          retention-days: 7

  build_wasm:
    name: Build wheels for wasm / emscripten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_PLATFORM: pyodide
      - uses: actions/upload-artifact@v7
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          name: cibw-wheels-pyodide-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  build_ios:
    name: Build wheels for iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - run: brew upgrade cmake --formula
      - uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_PLATFORM: ios
      - uses: actions/upload-artifact@v7
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          name: cibw-wheels-ios-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          retention-days: 7
