name: Build

on: [push, pull_request]

jobs:
  test_build_support:
    name: Test optional AVX2 build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install setuptools cffi
      - run: python -m unittest discover -s tools/tests -v
      - name: Build with automatic backend selection
        run: python setup.py build_ext --inplace
      - name: Verify target-based backend detection
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import platform
          configs = list(Path("build").glob("temp.*/pymunk-avx2-config.json"))
          assert len(configs) == 1, configs
          enabled = json.loads(configs[0].read_text())["enabled"]
          expected = platform.machine().lower() in ("x86_64", "amd64")
          assert enabled == expected, (enabled, expected)
          PY
      - run: python -m unittest pymunk.tests.test_space

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            windows-latest,
            macos-latest,
            macos-15-intel,
          ]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build sdist
        run: |
          pipx run build --sdist
          python3 -c "import os,pathlib,glob; pathlib.Path(os.environ['GITHUB_ENV']).write_text('SDIST_PATH=' + glob.glob('dist/*.tar.gz')[0] + '\n')"

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-* cp314t-* cp315-* cp315t-* pp311-* pp312-*"
        with:
          package-dir: ${{ env.SDIST_PATH }}

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@v7
        if: ${{ github.ref == 'refs/heads/master'}}
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          retention-days: 7

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v7
        if: ${{ github.ref == 'refs/heads/master' && matrix.os ==
          'windows-latest'}}
        with:
          name: sdist-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./dist/*.tar.gz
          retention-days: 7

  build_wasm:
    name: Build wheels for wasm / emscripten
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_PLATFORM: pyodide
      - uses: actions/upload-artifact@v7
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          name: cibw-wheels-pyodide-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  build_ios:
    name: Build wheels for iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
      - run: brew upgrade cmake --formula
      - uses: pypa/cibuildwheel@v4.3.1
        env:
          CIBW_PLATFORM: ios
      - uses: actions/upload-artifact@v7
        if: ${{ github.ref == 'refs/heads/master' }}
        with:
          name: cibw-wheels-ios-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          retention-days: 7
